# Beaver ARS Configuration File
# Author: [Your Name]
# Last Updated: 2024-01-02

# Model Configuration
model:
  intent_classifier:
    model_name: "klue/roberta-large"
    num_labels: 48
    max_length: 128
    checkpoint_path: "./models/intent_classifier/best_model.pt"
  
  ner_model:
    model_name: "klue/roberta-large"
    num_labels: 6
    max_length: 128
    checkpoint_path: "./models/ner_model/best_model.pt"
  
  search_model:
    sentence_transformer: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    bm25_weight: 0.3
    semantic_weight: 0.7

# Training Configuration
training:
  intent_classifier:
    batch_size: 16
    learning_rate: 2e-5
    num_epochs: 20
    warmup_ratio: 0.1
    weight_decay: 0.01
    early_stopping_patience: 3
  
  ner_model:
    batch_size: 16
    learning_rate: 2e-5
    num_epochs: 15
    warmup_ratio: 0.1
    weight_decay: 0.01

# Database Configuration
database:
  host: "localhost"
  port: 3306
  name: "beaver_ars"
  user: "root"
  password: "your_password_here"  # Change in production
  pool_size: 10
  max_overflow: 20

# Redis Cache Configuration
redis:
  host: "localhost"
  port: 6379
  db: 0
  max_connections: 50
  ttl: 3600  # Cache TTL in seconds

# API Configuration
api:
  host: "0.0.0.0"
  port: 5000
  debug: false
  workers: 4
  timeout: 30
  max_requests: 1000

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "./logs/beaver_ars.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Performance Configuration
performance:
  enable_quantization: true
  batch_inference: true
  cache_enabled: true
  prefetch_enabled: true

# Data Paths
paths:
  data_dir: "./data"
  models_dir: "./models"
  logs_dir: "./logs"
  temp_dir: "./temp"
